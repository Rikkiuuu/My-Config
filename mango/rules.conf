# ---------- Window rules (floating dialogs) ----------
windowrule=isfloating:1,center:1,width:900,height:700,appid:pavucontrol
windowrule=isfloating:1,center:1,width:700,height:500,appid:blueman-manager
windowrule=isfloating:1,center:1,width:900,height:600,title:^(nmtui)
windowrule=isfloating:1,center:1,width:400,height:400,appid:gnome-calculator

# ---------- Floating: file pickers and save/open dialogs ----------
windowrule=isfloating:1,center:1,width:900,height:600,title:^(Open File|Open Files|Open Folder|Save As|Save File|Choose Files|Select Folder|Export)$

# ---------- Floating: authentication prompts ----------
windowrule=isfloating:1,center:1,width:500,height:300,appid:polkit-gnome-authentication-agent-1
windowrule=isfloating:1,center:1,width:500,height:300,appid:org.kde.polkit-kde-authentication-agent-1
windowrule=isfloating:1,center:1,width:500,height:300,appid:lxpolkit

# ---------- Floating: theme and settings tools ----------
windowrule=isfloating:1,center:1,width:800,height:600,appid:qt5ct
windowrule=isfloating:1,center:1,width:800,height:600,appid:qt6ct
windowrule=isfloating:1,center:1,width:800,height:600,appid:lxappearance
windowrule=isfloating:1,center:1,width:800,height:600,appid:nwg-look

# ---------- Floating: Firefox popups ----------
windowrule=isfloating:1,center:1,width:800,height:600,title:^(Library)$
windowrule=isfloating:1,width:480,height:270,title:^(Picture-in-Picture)$

# ---------- Layer rules (rofi zooms in/out) ----------
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi
