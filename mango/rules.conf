# Basic Floating Rules
window_rule=is_floating:1,app_id:pavucontrol
window_rule=is_floating:1,title:Picture-in-Picture

# Floating with Custom Size and Position
window_rule=is_floating:1,width:800,height:550,app_id:blueman-manager
window_rule=is_floating:1,width:900,height:650,offset_x:200,offset_y:150,app_id:nm-connection-editor

# Common Floating Presets
window_rule=is_floating:1,width:800,height:550,app_id:org.pulseaudio.pavucontrol
window_rule=is_floating:1,width:420,height:580,app_id:org.gnome.Calculator
window_rule=is_floating:1,app_id:zenity
window_rule=is_floating:1,app_id:xdg-desktop-portal-gtk
window_rule=is_floating:1,app_id:imv
window_rule=is_floating:1,app_id:mpv
window_rule=is_floating:1,title:^Picture-in-Picture$
window_rule=is_floating:1,title:^(Open File|Save File|Save As|Select Folder).*
