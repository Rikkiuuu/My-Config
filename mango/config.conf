# ~/.config/mango/config.conf
# Main file. Each section lives in its own file next to this one.
# Colors are 0xRRGGBBAA. Black theme, lavender accent (matches waybar).
# Check for errors after editing: mango -p ~/.config/mango/config.conf

source=~/.config/mango/autostart.conf
source=~/.config/mango/appearance.conf
source=~/.config/mango/animations.conf
source=~/.config/mango/layouts.conf
source=~/.config/mango/input.conf
source=~/.config/mango/rules.conf
source=~/.config/mango/binds.conf
