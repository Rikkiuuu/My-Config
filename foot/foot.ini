[main]
term=xterm-256color
shell=/usr/bin/zsh
font=JetBrainsMono Nerd Font:size=8
dpi-aware=yes
pad=12x12
resize-by-cells=no
bold-text-in-bright=no

[scrollback]
lines=10000
multiplier=3

[cursor]
style=block
blink=yes

[colors-dark]
alpha=1
background=1e1e2e
foreground=cdd6f4

regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=cba6f7
regular6=94e2d5
regular7=bac2de

bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=cba6f7
bright6=94e2d5
bright7=a6adc8

selection-foreground=cdd6f4
selection-background=45475a

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+f
font-increase=Control+plus
font-decrease=Control+minus
font-reset=Control+0

[mouse]
hide-when-typing=yes

[url]
launch=xdg-open ${url}
